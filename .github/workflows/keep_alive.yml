name: Despertar Streamlit — pendiente adaptación San Pedro

on:
  workflow_dispatch:

jobs:
  wake_up:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Playwright
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Ejecutar script de despertar
        run: |
          echo "ATENCIÓN: verificar la URL de San Pedro en wake_up_script.js antes de ejecutar."
          node wake_up_script.js
