name: Verificar despliegue privado

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar recursos locales requeridos
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "app_emergencia.py"
            "app_emergencia_core.py"
            "visualizacion_intensidad_relativa.py"
            "meteo_daily.csv"
            "logo.png"
            "IW.npy"
            "LW.npy"
            "bias_IW.npy"
            "bias_out.npy"
            "modelo_clusters_k3.pkl"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: falta el archivo requerido: $file"
              exit 1
            fi
          done

      - name: Bloquear dependencias públicas del propio repositorio
        shell: bash
        run: |
          set -euo pipefail

          if grep -RIn --include='*.py' \
            'raw.githubusercontent.com/PREDWEEM/lolium_sanpedro2026' .; then
            echo "ERROR: se detectó una dependencia pública del propio repositorio."
            exit 1
          fi

      - name: Verificar sintaxis Python
        run: |
          python -m py_compile \
            app_emergencia.py \
            app_emergencia_core.py \
            visualizacion_intensidad_relativa.py \
            actualizar_meteo_san_pedro.py \
            postprocesar_prec_p50_san_pedro.py

      - name: Prueba preliminar de escala relativa
        run: |
          python - <<'PY'
          from pathlib import Path
          from visualizacion_intensidad_relativa import parchear_visualizacion_intensidad_relativa

          core = Path("app_emergencia_core.py").read_text(encoding="utf-8")
          patched = parchear_visualizacion_intensidad_relativa(core)

          assert 'text="Intensidad relativa de emergencia (%)"' in patched
          assert 'y=df["EMERREL_REL_PCT"]' in patched
          assert 'y=df_campo["Campo_Normalizado_PCT"]' in patched
          assert 'range=[0.0, 105.0]' in patched
          assert 'tickvals=[0, 20, 40, 60, 80, 100]' in patched
          assert 'text="Log10(EMERREL + 0,01)"' not in patched
          assert 'y=df["EMERREL_LOG"]' not in patched
          compile(patched, "app_emergencia_core_patched.py", "exec")

          # Chequeo numérico simple de la definición visual.
          serie = [0.0, 0.05, 0.10, 0.20]
          maximo = max(serie)
          relativa = [valor / maximo * 100.0 for valor in serie]
          assert relativa == [0.0, 25.0, 50.0, 100.0]
          print("OK: máximo visual = 100 % y el core parcheado compila.")
          PY
