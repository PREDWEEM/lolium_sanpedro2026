name: Actualizar SIGA Tres Arroyos y ECMWF ENS — pendiente adaptación San Pedro

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-meteo-san-pedro-pendiente
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pandas numpy xlrd openpyxl

      - name: Verificar archivos disponibles
        run: |
          echo "Directorio actual:"
          pwd
          echo "Contenido del repositorio:"
          ls -la
          echo "Contenido de data, si existe:"
          ls -la data || true

      - name: Actualizar observaciones SIGA y pronóstico ECMWF ENS
        env:
          # Configuración clonada de Tres Arroyos. Adaptar antes de ejecutar para San Pedro.
          LATITUD: "-38.388"
          LONGITUD: "-60.346"
          SIGA_DOWNLOAD_URL: "https://siga.inta.gob.ar/document/series/NH0216.xls"
          SIGA_METHOD: GET
          SIGA_LOCAL_FILE: NH0216.xls
          SIGA_PARAMS_JSON: ${{ secrets.SIGA_PARAMS_JSON }}
          SIGA_POST_DATA_JSON: ${{ secrets.SIGA_POST_DATA_JSON }}
          SIGA_HEADERS_JSON: ${{ secrets.SIGA_HEADERS_JSON }}
          RELLENAR_HUECOS_CON_PRONOSTICO_VENCIDO: "false"
        run: |
          echo "ATENCIÓN: workflow clonado de Tres Arroyos. Adaptar estación y coordenadas antes de usar en San Pedro."
          python actualizar_meteo_tres_arroyos.py
          python postprocesar_prec_p50_tres_arroyos.py

      - name: Guardar archivos actualizados
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p data/historico_pronosticos
          TMPDIR_GENERADO="$(mktemp -d)"

          if [ -f meteo_daily.csv ]; then
            cp meteo_daily.csv "$TMPDIR_GENERADO/meteo_daily.csv"
          fi

          mkdir -p "$TMPDIR_GENERADO/data"
          mkdir -p "$TMPDIR_GENERADO/data/historico_pronosticos"

          if [ -f data/estado_actualizacion_meteo.json ]; then
            cp data/estado_actualizacion_meteo.json "$TMPDIR_GENERADO/data/estado_actualizacion_meteo.json"
          fi

          if [ -f data/siga_tres_arroyos_observado.csv ]; then
            cp data/siga_tres_arroyos_observado.csv "$TMPDIR_GENERADO/data/siga_tres_arroyos_observado.csv"
          fi

          if [ -d data/historico_pronosticos ]; then
            cp -a data/historico_pronosticos/. "$TMPDIR_GENERADO/data/historico_pronosticos/" || true
          fi

          git fetch origin main
          git reset --hard origin/main

          mkdir -p data/historico_pronosticos

          if [ -f "$TMPDIR_GENERADO/meteo_daily.csv" ]; then
            cp "$TMPDIR_GENERADO/meteo_daily.csv" meteo_daily.csv
          fi

          if [ -f "$TMPDIR_GENERADO/data/estado_actualizacion_meteo.json" ]; then
            cp "$TMPDIR_GENERADO/data/estado_actualizacion_meteo.json" data/estado_actualizacion_meteo.json
          fi

          if [ -f "$TMPDIR_GENERADO/data/siga_tres_arroyos_observado.csv" ]; then
            cp "$TMPDIR_GENERADO/data/siga_tres_arroyos_observado.csv" data/siga_tres_arroyos_observado.csv
          fi

          if [ -d "$TMPDIR_GENERADO/data/historico_pronosticos" ]; then
            cp -a "$TMPDIR_GENERADO/data/historico_pronosticos/." data/historico_pronosticos/ || true
          fi

          git add -A meteo_daily.csv data/

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
            exit 0
          fi

          git commit -m "Actualiza datos meteorológicos"
          git push origin HEAD:main
